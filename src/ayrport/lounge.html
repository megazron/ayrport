<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayrport Lounge</title>
<style>
:root { --ink: #f3efe6; --muted: #9aa3b5; --amber: #ffb547; --glass: rgb(12 16 28 / .72); --line: rgb(255 255 255 / .12); --mono: ui-monospace, "JetBrains Mono", Consolas, monospace; --ui: system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05070d; color: var(--ink); font: 14px/1.45 var(--ui); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
button, input, select { font: inherit; color: inherit; }
.glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; }
#hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s; }
#hud.hidden { opacity: 0; }
#hud > * { pointer-events: auto; }
#banner { position: absolute; left: 16px; top: 16px; padding: 12px 16px; max-width: min(440px, calc(100vw - 32px)); }
#greet { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
#where { font-size: 18px; font-weight: 600; }
#meta { color: var(--muted); font: 12px var(--mono); margin-top: 2px; }
#tools { position: absolute; right: 16px; top: 16px; display: flex; gap: 6px; padding: 6px; }
#tools button { background: none; border: 0; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 15px; }
#tools button:hover { background: rgb(255 255 255 / .08); }
#prompt { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; white-space: nowrap; display: none; }
#prompt kbd, .card kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 6px; background: rgb(255 255 255 / .06); }
#flightbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 14px 18px; display: none; }
#fb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#fb-route { font: 13px var(--mono); color: var(--muted); }
#fb-time { font: 600 34px var(--mono); letter-spacing: .04em; }
#fb-track { position: relative; height: 4px; background: rgb(255 255 255 / .12); border-radius: 4px; margin: 12px 0 10px; }
#fb-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); border-radius: 4px; }
#fb-plane { position: absolute; top: -9px; font-size: 16px; transform: translateX(-50%) rotate(90deg); }
#fb-row { display: flex; gap: 8px; justify-content: flex-end; }
#toast { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -10px); padding: 10px 16px; opacity: 0; transition: .35s; max-width: min(520px, calc(100vw - 32px)); text-align: center; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#modal { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; background: rgb(0 0 0 / .35); z-index: 5; }
#modal.open { display: grid; }
.card { width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; }
.card h2 { margin: 0 0 6px; font-size: 20px; }
.card h3 { margin: 16px 0 6px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 6px 0; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.btn { background: rgb(255 255 255 / .06); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: rgb(255 255 255 / .35); }
.btn.go { background: var(--amber); color: #1b1203; border-color: var(--amber); font-weight: 700; }
.btn.sel { border-color: var(--amber); color: var(--amber); }
.field { width: 100%; background: rgb(255 255 255 / .06); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none; }
.field:focus { border-color: var(--amber); }
.pass { border: 1px dashed rgb(255 255 255 / .25); border-radius: 12px; padding: 14px; margin: 14px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; font: 13px var(--mono); }
.pass span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .12em; }
.pass b { font-size: 16px; }
.board { font: 13px var(--mono); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.board div { display: grid; grid-template-columns: 62px 1fr 44px 92px 24px; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); align-items: center; }
.board div:first-child { border-top: 0; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
.board .st { color: var(--amber); cursor: pointer; }
.board .done { color: #6ee7a8; }
.board .x { background: none; border: 0; color: var(--muted); cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stats div { background: rgb(255 255 255 / .05); border-radius: 10px; padding: 10px 12px; }
.stats b { display: block; font: 600 20px var(--mono); }
.stamps { display: flex; flex-wrap: wrap; gap: 8px; }
.stamp { width: 54px; height: 54px; border-radius: 50%; border: 2px solid; display: grid; place-items: center; font: 700 13px var(--mono); transform: rotate(var(--r)); }
.secrets { display: flex; flex-wrap: wrap; gap: 6px; }
.secrets span { padding: 4px 9px; border-radius: 99px; background: rgb(255 255 255 / .06); font-size: 13px; }
.piano { position: relative; display: flex; height: 150px; margin-top: 12px; user-select: none; touch-action: none; }
.wk { flex: 1; background: #f4f1ea; border: 1px solid #222; border-radius: 0 0 6px 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; color: #888; font: 10px var(--mono); cursor: pointer; }
.bk { position: absolute; top: 0; width: 6%; height: 60%; background: #15171d; border-radius: 0 0 4px 4px; z-index: 2; color: #777; font: 9px var(--mono); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; cursor: pointer; }
.wk.down { background: var(--amber); } .bk.down { background: #8a5a00; }
input[type=range] { accent-color: var(--amber); width: 100%; }
label.slider { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.big { font: 600 15px var(--mono); }
@media (max-width: 560px) { #banner { right: 16px; } #tools { top: auto; bottom: 16px; right: 50%; transform: translateX(50%); } #prompt, #flightbar { bottom: 72px; } }
</style>
</head>

    <button id="t-help" title="How it works (?)">?</button>

  for (const n of npcs) {
    n.x += n.v * step; n.frame = Math.floor(now / 160);
    sprites.push([n.y, () => person(n.x - cam, n.y, n.look, n.frame, Math.sign(n.v), n.bag)]);
  }
  npcs = npcs.filter((n) => n.x > -40 && n.x < WORLD + 40);
  while (npcs.length < 4) npcs.push(newNpc());
  sprites.push([166, () => person(player.x - cam, 166, S.look, mv ? player.frame : 0, player.dir, false)]);
  sprites.sort((a, b) => a[0] - b[0]).forEach(([, f]) => f());
  drawParts(cam, step);
  if (light < 0.35) { ctx.globalAlpha = 0.12; R(0, 0, W, H, "#0a0e2a"); ctx.globalAlpha = 1; }
  flashFx();
  // prompt
  const o = nearestObject(), pr = $("#prompt");
  if (o && !$("#modal").classList.contains("open")) { pr.innerHTML = `<kbd>E</kbd>${o.label}`; pr.style.display = "block"; } else pr.style.display = "none";
  if (layover) { const left = layover - Date.now(); if (left <= 0) { layover = 0; chime([72, 79]); toast("Layover over. Ready for the next flight?"); } else if (Math.floor(left / 1000) % 60 === 0 && Math.floor(left / 1000) !== 0 && Math.random() < 0.03) toast(`Layover: ${Math.ceil(left / 60000)} min left`); }
  if (now > announceAt) { announceAt = now + 120000 + Math.random() * 120000; announce(); }
  if (Math.floor(now / 30000) !== frame.lastBanner) { frame.lastBanner = Math.floor(now / 30000); updateBanner(); }
}
function flashFx() { if (flash > 0) { ctx.globalAlpha = flash * 0.6; R(0, 0, W, H, "#fff"); ctx.globalAlpha = 1; flash -= 0.08; } }
function announce() {
  if (S.flight || $("#modal").classList.contains("open")) return;
  const dest = pick(Math.random, AIRPORTS.filter((a) => a !== airport));
  const lines = [`Flight AY${100 + Math.floor(Math.random() * 900)} to ${dest.city} is now boarding at gate ${"ABC"[Math.floor(Math.random() * 3)]}${1 + Math.floor(Math.random() * 12)}.`,
    S.name ? `Passenger ${S.name}, your focus flight is ready at Gate A7.` : "Focus flights are boarding at Gate A7.",
    `The local time in ${airport.city} is ${localTime(airport)}. Thank you for flying Ayrport.`,
    "Please keep your belongings with you, and remember to drink some water."];
  chime([72, 76, 79]);
  toast("🔔 " + pick(Math.random, lines), 5500);
}

// ======================================================================= start
(function init() {
  addEventListener("resize", resize); resize();
  airport = airport || guessFromTimezone();
  S.at = airport.iata;
  buildScene(); updateBanner(); fetchWeather();
  if (S.flight) toast("Welcome back — your flight is still in the air.");
  openSplash();
  requestAnimationFrame(frame);
})();
</script>
