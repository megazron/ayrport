<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayrport Lounge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root { --ink: #f4f1ea; --muted: #a3abbd; --amber: #ffb547; --glass: rgba(14, 17, 27, .66); --line: rgba(255, 255, 255, .1); --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; --ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #070910; color: var(--ink); font: 14px/1.5 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }
button, input, select { font: inherit; color: inherit; }
.glass { background: var(--glass); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
#hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .5s; }
#hud.hidden { opacity: 0; }
#hud > * { pointer-events: auto; }
#banner { position: absolute; left: 20px; top: 20px; padding: 14px 18px 14px 16px; display: flex; gap: 14px; align-items: center; max-width: min(460px, calc(100vw - 40px)); }
#code { font: 800 18px var(--ui); letter-spacing: .04em; background: var(--amber); color: #1b1203; border-radius: 12px; padding: 10px 10px; min-width: 62px; text-align: center; }
#greet { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
#where { font-size: 17px; font-weight: 700; line-height: 1.25; }
#meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
#tools { position: absolute; right: 20px; top: 20px; display: flex; gap: 4px; padding: 6px; border-radius: 16px; }
#tools button { background: none; border: 0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; color: var(--ink); opacity: .85; transition: .15s; }
#tools button:hover { background: rgba(255, 255, 255, .1); opacity: 1; }
#tools svg { width: 20px; height: 20px; }
#prompt { display: none !important; }
#flightbar { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 16px 20px; display: none; }
#fb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#fb-route { font: 600 13px var(--ui); color: var(--muted); letter-spacing: .02em; }
#fb-time { font: 600 40px var(--mono); letter-spacing: .02em; margin-top: 2px; }
#fb-track { position: relative; height: 5px; background: rgba(255, 255, 255, .12); border-radius: 5px; margin: 12px 0 12px; }
#fb-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ffcf7a, var(--amber)); border-radius: 5px; }
#fb-plane { position: absolute; top: -10px; font-size: 18px; transform: translateX(-50%) rotate(90deg); }
#fb-row { display: flex; gap: 8px; justify-content: flex-end; }
#toast { position: absolute; left: 50%; top: 22px; transform: translate(-50%, -12px); padding: 12px 18px; opacity: 0; transition: .35s cubic-bezier(.2, .8, .2, 1); max-width: min(520px, calc(100vw - 40px)); text-align: center; pointer-events: none; font-weight: 500; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#modal { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; background: rgba(5, 7, 14, .45); z-index: 5; }
#modal.open { display: grid; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.card { width: min(500px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 26px; border-radius: 22px; animation: pop .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.card h3 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card p { margin: 6px 0; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.btn { background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; cursor: pointer; font-weight: 600; transition: .15s; }
.btn:hover { background: rgba(255, 255, 255, .12); }
.btn.go { background: var(--amber); color: #1b1203; border-color: var(--amber); font-weight: 800; }
.btn.go:hover { filter: brightness(1.06); }
.btn.sel { border-color: var(--amber); color: var(--amber); background: rgba(255, 181, 71, .08); }
.field { width: 100%; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; }
.field:focus { border-color: var(--amber); }
select.field option { color: #111; }
kbd { font: 600 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 1px 7px; margin-right: 4px; background: rgba(255, 255, 255, .06); }
.pass { position: relative; border-radius: 16px; padding: 16px 18px; margin: 16px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; background: linear-gradient(135deg, rgba(255, 181, 71, .14), rgba(90, 169, 255, .08)); border: 1px solid rgba(255, 255, 255, .12); }
.pass::after { content: ""; position: absolute; right: 64px; top: 10px; bottom: 10px; border-right: 2px dashed rgba(255, 255, 255, .15); }
.pass span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .14em; font-weight: 700; }
.pass b { font: 700 17px var(--mono); }
.board { font: 500 13px var(--mono); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); }
.board div { display: grid; grid-template-columns: 62px 1fr 44px 96px 24px; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); align-items: center; }
.board div:first-child { border-top: 0; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
.board .st { color: var(--amber); cursor: pointer; }
.board .done { color: #6ee7a8; }
.board .x { background: none; border: 0; color: var(--muted); cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stats div { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--muted); font-size: 12px; }
.stats b { display: block; font: 700 22px var(--mono); color: var(--ink); }
.stamps { display: flex; flex-wrap: wrap; gap: 10px; }
.stamp { width: 58px; height: 58px; border-radius: 50%; border: 2.5px double; display: grid; place-items: center; font: 700 13px var(--mono); transform: rotate(var(--r)); }
.secrets { display: flex; flex-wrap: wrap; gap: 6px; }
.secrets span { padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .06); font-size: 13px; }
.piano { position: relative; display: flex; height: 160px; margin-top: 14px; user-select: none; touch-action: none; border-radius: 10px; overflow: hidden; }
.wk { flex: 1; background: linear-gradient(#fff, #ece8df); border: 1px solid #1a1a1f; border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; color: #999; font: 10px var(--mono); cursor: pointer; }
.bk { position: absolute; top: 0; width: 6%; height: 60%; background: linear-gradient(#2a2a30, #0d0d10); border-radius: 0 0 5px 5px; z-index: 2; color: #777; font: 9px var(--mono); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; cursor: pointer; }
.wk.down { background: linear-gradient(#ffd38a, var(--amber)); } .bk.down { background: #8a5a00; }
input[type=range] { accent-color: var(--amber); width: 100%; }
label.slider { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.big { font: 600 16px var(--ui); }
#zone { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); text-align: center; font: 800 34px var(--ui); letter-spacing: -.01em; text-shadow: 0 4px 24px rgba(0,0,0,.45); opacity: 0; pointer-events: none !important; white-space: nowrap; }
#zone small { display: block; font: 700 11px var(--ui); letter-spacing: .3em; color: var(--amber); margin-bottom: 4px; }
#zone.show { animation: zone 3.2s ease forwards; }
@keyframes zone { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
#map { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(720px, calc(100vw - 40px)); height: 34px; padding: 4px; display: flex; gap: 3px; border-radius: 14px; }
#map .seg { position: relative; display: grid; place-items: center; border-radius: 9px; background: rgba(255,255,255,.06); font: 700 10px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; overflow: hidden; white-space: nowrap; transition: .2s; }
#map .seg:hover { background: rgba(255,255,255,.12); color: var(--ink); }
#map .seg.on { background: rgba(255,181,71,.18); color: var(--amber); }
#map-dot { position: absolute; top: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgba(255,181,71,.3), 0 0 14px var(--amber); pointer-events: none; transition: left .1s linear; }
#quests { position: absolute; right: 20px; top: 84px; width: 250px; padding: 12px 14px; font-size: 12.5px; }
#quests h4 { margin: 0 0 8px; font: 700 10px var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
#quests div { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; color: var(--ink); }
#quests div::before { content: ""; width: 7px; height: 7px; border-radius: 2px; border: 1.5px solid var(--amber); flex: none; transform: translateY(-1px); }
#quests .prog { margin-left: auto; color: var(--muted); font: 600 11px var(--mono); }
@media (max-width: 900px) { #quests { display: none; } }
#fade { position: fixed; inset: 0; background: #05070d; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 6; }
#fade.on { opacity: 1; }
#flightbar { bottom: 70px !important; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at center, #141c33, #05070d); z-index: 4; }
@media (max-width: 600px) { #banner { right: 20px; } #tools { top: auto; bottom: 20px; right: 50%; transform: translateX(50%); } #flightbar { bottom: 84px; } }

// ---------------------------------------------------------------- backdrops per zone

  const sb = S.flight.seatbelt; fillRR(cx - 90, 20, 180, 34, 17, "rgba(15,18,28,.85)"); ctx.fillStyle = sb ? "#ffb547" : "#6ee7a8"; ctx.font = "700 13px Inter, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(sb ? "● FASTEN SEATBELT" : "● SEATBELT OFF", cx, 37); ctx.textAlign = "left";
  ctx.fillStyle = vgrad(0, h, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,.25)"]]); ctx.fillRect(0, 0, w, h);
}

// ---------------------------------------------------------------- input
function nearestObject() { let best = null, bd = Infinity; for (const o of objects) { if (!o.act) continue; const d = Math.abs(me.x - o.x) - o.w / 2; if (d < 50 && d < bd) { bd = d; best = o; } } return best; }
function interact() { if (S.flight) return; const o = nearestObject(); if (o) o.act(); }
function toggleZen() { zen = !zen; $("#hud").classList.toggle("hidden", zen); if (zen) toast("Focus view. Press H to bring things back.", 2500); }
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
addEventListener("keydown", (e) => {
  if (splashOpen) return;
  const k = e.key.toLowerCase();
  if ($("#modal").classList.contains("open")) { if (k === "escape") closeModal(); else if (pianoOpen && KEYMAP[k] !== undefined && !e.repeat) press(KEYMAP[k]); return; }
  if (e.target.tagName === "INPUT") return;
  keys[k] = true; keys.shift = e.shiftKey; audioInit();
  if (k === "e" || k === "enter" || k === " ") { e.preventDefault(); interact(); }
  else if (k === "b" && !S.flight) openBoard();
  else if (k === "p") openPassport();
  else if (k === "m") toggleMute();
  else if (k === "h") toggleZen();
  else if (k === "f") toggleFull();
  else if (k === "?" || k === "/") openHelp();
  if (k.startsWith("arrow")) e.preventDefault();
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; keys.shift = e.shiftKey; });
addEventListener("blur", () => { keys = {}; });
cv.addEventListener("pointerdown", (e) => {
  audioInit(); if (S.flight || splashOpen) return;
  const rect = cv.getBoundingClientRect(), wx = camX + (e.clientX - rect.left) / rect.width * VW, wy = (e.clientY - rect.top) / rect.height * LH;
  const hit = objects.find((o) => o.act && wx > o.x - o.w / 2 - 10 && wx < o.x + o.w / 2 + 10 && wy > o.base - o.h - 40 && wy < o.base + 30);
  me.target = clamp(hit ? hit.x : wx, 40, WW - 40); me.after = hit || null; me.sitting = false;
});
$("#t-board").onclick = () => !S.flight && openBoard();
$("#t-passport").onclick = openPassport;
$("#t-sound").onclick = openSound;
$("#t-zen").onclick = toggleZen;
$("#t-full").onclick = toggleFull;
$("#t-help").onclick = openHelp;

// ---------------------------------------------------------------- loop
let last = performance.now(), announceAt = performance.now() + 60000 + Math.random() * 60000, lastBanner = 0, wasFlying = false;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR);
  SC = cv.height / LH; VW = cv.width / SC;
}
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t;
  if (!world) return;
  hour = localHour(airport); light = dayLight(hour);
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  updateFlightBar();
  if (S.flight) { if (!wasFlying) wasFlying = true; $("#prompt").style.display = "none"; drawCabin(dt); return; }
  wasFlying = false;
  // move
  let mv = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  if (mv) { me.target = null; me.after = null; me.sitting = false; }
  else if (me.target != null) { const d = me.target - me.x; if (Math.abs(d) < 6) { me.target = null; if (me.after) { const o = me.after; me.after = null; o.act(); } } else mv = Math.sign(d); }
  if (mv) { const sp = (keys.shift ? 330 : 190) * (level === "ground" && me.x > WALK[0] && me.x < WALK[1] ? 1.9 : 1); me.x = clamp(me.x + mv * sp * dt, 40, WW - 40); me.dir = mv; const before = me.phase; me.phase += dt * sp / 18; if (Math.floor(before / Math.PI) !== Math.floor(me.phase / Math.PI)) footstep(); }
  if (level === "ground") { const side = Math.sign(me.x - SCANNER_X); if (scannerSide !== null && side !== scannerSide && side !== 0) { const sc = objects.find((o) => o.kind === "scanner"); const red = Math.random() < 0.2; if (sc) { sc.t = 1.2; sc.red = red; } chime(red ? [60, 60] : [84]); toast(red ? "Beep! Random check… just your belt buckle. You're clear." : "All clear. Welcome airside.", 2600); secret("scanner"); } scannerSide = side; }
  me.blink = (t % 4200) < 120;
  camX += (clamp(me.x - VW * 0.45, 0, WW - VW) - camX) * Math.min(1, dt * 6);
  updateZone();
  // scene
  const [top, bot] = skyColors(hour);
  ctx.save(); ctx.translate(-camX, 0);
  drawBackdrop(top, bot);
  const actors = [];
  const cx = camX + VW / 2;
  for (const o of objects) if (Math.abs(o.x - cx) < VW / 2 + o.w / 2 + 200) actors.push([o.back || o.kind === "board" || o.kind === "lift" ? 0 : o.kind === "walkway" || o.kind === "carousel" ? 605 : o.base, () => o.draw(o), o]);
  for (const n of npcs) {
    if (!n.sitting) { n.x += n.v * dt; n.phase += Math.abs(n.v) * dt / 18; if (Math.abs(n.x - me.x) < 40 && Math.abs(n.base - me.base) < 25) n.base += (n.base > me.base ? 1 : -1) * 40 * dt; }
    const s = 1.12 + (n.base - 600) / 90 * 0.18;
    if (Math.abs(n.x - cx) < VW / 2 + 120) actors.push([n.base, () => person(n.x, n.base, s, n.look, n.phase, n.sitting ? 0 : 1, n.dir, { bag: n.bag, sitting: n.sitting, blink: (t + n.x * 7) % 5000 < 120 }), null]);
  }
  npcs = npcs.filter((n) => n.sitting || (n.x > -100 && n.x < WW + 100));
  while (npcs.filter((n) => !n.sitting).length < (level === "roof" ? 4 : 26)) npcs.push(newNpc());
  LEVELS[level].npcs = npcs;
  actors.push([me.sitting ? 600 : me.base, () => person(me.x, me.sitting ? 600 : me.base, 1.3, S.look, me.phase, mv ? (keys.shift ? 1.35 : 1) : 0, me.dir, { blink: me.blink, sitting: me.sitting }), null]);
  actors.sort((a, b) => a[0] - b[0]);
  // reflections on the polished floor
  if (level === "ground") for (const [, draw, o] of actors) if (!o || (!o.noReflect && !o.back && o.kind !== "board" && o.kind !== "lift")) reflect(draw);
  ctx.fillStyle = vgrad(FLOOR, LH, [[0, "rgba(0,0,0,0)"], [1, rgba(mixHex("#d9d3c7", "#2b2c38", 1 - light), 0.5)]]); ctx.fillRect(camX, FLOOR + 4, VW, LH - FLOOR);
  for (const [, draw] of actors) draw();
  drawParts(dt);
  // interaction bubble
  const near = nearestObject();
  if (near && !$("#modal").classList.contains("open")) {
    const bx = near.x, by = Math.max(near.base - near.h - 34, 90) + Math.sin(t / 300) * 3;
    ctx.font = "600 15px Inter, system-ui, sans-serif"; const tw = ctx.measureText(near.label).width;
    fillRR(bx - tw / 2 - 44, by - 20, tw + 60, 40, 20, "rgba(14,17,27,.88)");
    fillRR(bx - tw / 2 - 36, by - 13, 26, 26, 7, "#ffb547"); ctx.fillStyle = "#1b1203"; ctx.font = "800 14px Inter, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("E", bx - tw / 2 - 23, by + 1);
    ctx.fillStyle = "#f3efe6"; ctx.font = "600 15px Inter, system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillText(near.label, bx - tw / 2, by + 1);
    ctx.beginPath(); ctx.moveTo(bx - 8, by + 20); ctx.lineTo(bx + 8, by + 20); ctx.lineTo(bx, by + 28); ctx.fillStyle = "rgba(14,17,27,.88)"; ctx.fill();
  }
  // foreground leaves for depth
  ctx.globalAlpha = 0.9;
  if (level === "ground") for (const fxp of [60, 3420, 5600, 7700, 9400]) { const x = fxp - camX * 0.25; if (x > camX - 300 && x < camX + VW + 100) ctx.drawImage(LEAF, x, LH - 210, 170, 200); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // night grade and vignette
  if (light < 0.6) { ctx.fillStyle = `rgba(20,24,60,${(0.6 - light) * 0.35})`; ctx.fillRect(0, 0, VW, LH); }
  const vg = ctx.createRadialGradient(VW / 2, LH / 2, LH * 0.45, VW / 2, LH / 2, LH * 1.05); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.35)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, LH);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, VW, LH); flash -= 0.06; }
  // planes on the runway
  if (Math.random() < dt / 20 && planes.length < 2) planes.push({ x: camX * 0.45 - 300, y: 452, v: 20, climb: 0, livery: pick(Math.random, ["#ffb547", "#2f6fd6", "#d64545", "#2aa876", "#7b4fd6"]) });
  for (const p of planes) { p.v = Math.min(260, p.v + 55 * dt); if (p.v > 190) { p.climb = Math.min(0.2, p.climb + dt * 0.1); p.y -= Math.sin(p.climb) * p.v * dt; } p.x += p.v * dt; }
  planes = planes.filter((p) => p.x < camX * 0.45 + VW + 400 && p.y > -100);
  if (level === "roof") { if (Math.random() < dt / 14 && roofPlanes.length < 1) roofPlanes.push({ x: camX - 400, y: 400, v: 110, climb: 0.04, livery: pick(Math.random, ["#ffb547", "#2f6fd6", "#d64545", "#2aa876", "#7b4fd6"]) }); for (const p of roofPlanes) { p.v = Math.min(300, p.v + 40 * dt); p.climb = Math.min(0.22, p.climb + dt * 0.03); p.x += p.v * dt; p.y -= Math.sin(p.climb) * p.v * dt; } roofPlanes = roofPlanes.filter((p) => p.x < camX + VW + 500 && p.y > -200); }
  if (layover) { const left = layover - Date.now(); if (left <= 0) { layover = 0; chime([72, 79]); toast("Layover over. Ready for the next flight?"); } }
  if (t > announceAt) { announceAt = t + 120000 + Math.random() * 120000; announce(); }
  if (t - lastBanner > 30000) { lastBanner = t; updateBanner(); }
}
function footstep() {
  if (!A.ctx || muted) return;
  const c = A.ctx, len = c.sampleRate * 0.05, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = c.createBufferSource(); src.buffer = b; const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1000; const g = c.createGain(); g.gain.value = 0.04;
  src.connect(f); f.connect(g); g.connect(A.sfx); src.start();
}
function announce() {
  if (S.flight || $("#modal").classList.contains("open")) return;
  const dest = pick(Math.random, AIRPORTS.filter((a) => a !== airport));
  const lines = [`Flight AY${100 + Math.floor(Math.random() * 900)} to ${dest.city} is now boarding at gate ${"ABC"[Math.floor(Math.random() * 3)]}${1 + Math.floor(Math.random() * 12)}.`,
    S.name ? `Passenger ${S.name}, your focus flight is ready at Gate A7.` : "Focus flights are boarding at Gate A7.",
    `The local time in ${airport.city} is ${localTime(airport)}. Thank you for flying Ayrport.`, "Please keep your belongings with you, and remember to drink some water."];
  chime([72, 76, 79]); toast("🔔 " + pick(Math.random, lines), 5500);
}

// ======================================================================= start
(function init() {
  addEventListener("resize", resize); resize();
  airport = airport || guessFromTimezone();
  S.at = airport.iata;
  applyLook();
  buildScene(); updateBanner(); fetchWeather();
  if (S.pos) { setLevel(S.pos.level === "roof" ? "roof" : "ground"); me.x = clamp(S.pos.x || 980, 40, WW - 40); } else me.x = GATE_X - 140;
  camX = clamp(me.x - VW * 0.45, 0, WW - VW);
  setInterval(() => { S.pos = { level, x: Math.round(me.x) }; store.save(); }, 4000);
  $("#loading").style.display = "none";
  if (S.flight) toast("Welcome back — your flight is still in the air.");
  openSplash();
  requestAnimationFrame(frame);
})();
</script>
