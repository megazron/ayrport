[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ayrport"
version = "1.2.0"
description = "A programming language spoken in airport and flight terms. Compiles to Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gaus Mohiuddin Sayyad (megazron)" }]
keywords = ["programming-language", "transpiler", "education", "airport", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/megazron/ayrport"

[project.scripts]
ayr = "ayrport.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
